# RoleReady backend configuration.
# Every value is overridable via environment variables (see /.env.example).
# Hosting: set these env vars on your provider (Railway/Render/Fly/etc.), no code change needed.
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/roleready?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:roleready}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MAX_FILE_SIZE:10MB}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
            scope: openid, profile, email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-32-byte-minimum-secret-for-dev-only}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  guest:
    max-uses: ${APP_GUEST_MAX_USES:3}
  session:
    ttl-minutes: ${APP_SESSION_TTL_MINUTES:120}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout-ms: ${GEMINI_TIMEOUT_MS:60000}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.roleready: INFO
